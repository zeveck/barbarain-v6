<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Metal Mania'; src: url(../game/fonts/MetalMania-Regular.woff2); }
@font-face { font-family: 'Alegreya'; src: url(../game/fonts/Alegreya-Italic.woff2); font-style: italic; }
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0e0c12}
.bg{position:absolute;inset:0;background:url(../game/assets/bg/bg-title.png) center/cover;image-rendering:pixelated}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0e0c12ee 0%,#0e0c1299 45%,transparent 75%)}
.t{position:absolute;left:70px;top:150px}
h1{font-family:'Metal Mania';font-weight:400;font-size:150px;margin:0;color:#e8b04b;line-height:1;text-shadow:0 5px 0 #6b3f1c,0 10px 0 #3a2412,0 0 50px #000}
h1 span{color:#5fb4d9;text-shadow:0 5px 0 #16466b,0 10px 0 #0b2236,0 0 40px #5fb4d9aa}
p{font-family:'Alegreya';font-style:italic;font-size:38px;color:#e9dec4;margin:28px 0 0 6px;text-shadow:0 3px 6px #000;max-width:620px}
img.b{position:absolute;right:60px;bottom:40px;width:288px;height:288px;image-rendering:pixelated;border:4px solid #a8622c;border-radius:8px;background:#0e0c12cc}
</style></head><body><div class="bg"></div><div class="t"><h1>Barbar<span>AI</span>n</h1><p>Steal a star. Cross the sea.<br>Outrun a thousand years.</p></div><img class="b" src="../game/assets/portraits/brannoc.png"></body></html>
